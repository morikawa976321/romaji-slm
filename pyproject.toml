[project]
name = "romaji-slm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.2.0",
    "safetensors>=0.8.0",
    "torch>=2.11.0",
    "transformers>=5.19.0",
]

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"

[dependency-groups]
dev = [
    "gguf>=0.19.0",
    "numpy>=2.5.2",
    "sentencepiece>=0.2.2",
]
