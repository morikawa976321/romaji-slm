[project]
name = "romaji-slm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.2.0",
    "safetensors>=0.8.0",
    "torch>=2.11.0",
    "transformers>=5.19.0",
]

[tool.uv]
default-groups = ["dev", "core"]

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "numpy>=2.5.2",
    "sentencepiece>=0.2.2",
]
eval = [
    "pytest>=8.0",
]
core = [
    "marisa-trie>=1.2.0",
    "wordfreq>=3.1.1",
    # GPU の無い機械の常駐入力が使う ONNX Runtime 版（core/ort_backend.py、docs/decisions.md D43）。onnx は初回の書き出しに要る
    "onnxruntime>=1.31.0",
    "onnx>=1.23.2",
]
data = [
    "datasets>=4.0.0",
    "sudachipy>=0.6.10",
    "sudachidict-core>=20250129",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
